services:
  db:
    image: postgres:16
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: expense-tracker-redis
    ports:
      - "6379:6379"
  s3mock:
    image: adobe/s3mock:latest
    container_name: expense-tracker-s3mock
    environment:
      - initialBuckets=expense-receipts
      - retainFilesOnExit=true
    ports:
      - "9090:9090"
    volumes:
      - s3mock_data:/data
  worker:
    build: .
    container_name: expense-tracker-worker
    command: python -m app.workers.outbox_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/expense_tracker
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
  csv_worker:
    build: .
    container_name: expense-tracker-csv-worker
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/expense_tracker
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
  api:
    build: .
    container_name: expense-tracker-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/expense_tracker
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  s3mock_data: